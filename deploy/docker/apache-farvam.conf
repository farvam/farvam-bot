ServerName farvam-site
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>
# Real visitor IP and HTTPS flag from Caddy (host reverse proxy)
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
